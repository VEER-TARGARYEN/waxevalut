# Render blueprint for the WaxeValut backend (FastAPI -> CognoDB).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads this file.
#
# The three secrets are marked sync:false, so Render prompts for them in the dashboard and
# never stores them in the repo. After the first deploy, set CORS_ORIGINS to your frontend's
# origin (e.g. https://waxevalut.vercel.app) so the browser is allowed to call the API.

services:
  - type: web
    name: waxevalut-api
    runtime: python
    plan: free # free tier spins down when idle; first request after idle cold-starts (~50s)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: COGNODB_URI
        sync: false # bolt+s://<instance-id>.databases.cognodb.cloud
      - key: COGNODB_USER
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false # set to your deployed frontend origin, e.g. https://waxevalut.vercel.app
